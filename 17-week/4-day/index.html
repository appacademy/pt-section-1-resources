<!DOCTYPE html>
<html>

<head>
    <script>
        window.addEventListener('DOMContentLoaded', event => {
            function handler(e) {
                console.log("origin:", e.target, "current:", e.currentTarget, "elementId", e.target.id);
                e.stopPropagation();
            }
            window.addEventListener('click', handler);
            document.addEventListener('click', handler);
            document.body.addEventListener('click', handler);
            document.querySelector('main').addEventListener('click', handler);
            document.querySelector('div').addEventListener('click', handler);
            // document.querySelectorAll('p').forEach(p => p.addEventListener('click', handler));
            document.querySelector('span').addEventListener('click', handler);
        });
    </script>
    <script src="scratch.js"></script>
    <title>Bubble Demo</title>
</head>

<body>
    <main>
        <div>
            <p id="p1">This is a paragraph in a div in a main in a body in an html</p>
            <p id="p2">This is a second paragraph in a div <span>AND I'm a span in a paragraph!</span> in a main in a body in an
                html</p>
            <p id="p3">This is a third paragraph in a div in a main in a body in an html</p>
        </div>
    </main>
    <form class="form form--signup" id="signup-form">
        <p>Sample Form</p>
        <input class="form__field" id="name" type="text" placeholder="Name" style="display:block">
        <input class="form__field" id="email" type="text" placeholder="Email" style="display:block">
        <input class="form__field" id="password" type="text" placeholder="Password" style="display:block">
        <input class="form__field" id="confirm-password" type="text" placeholder="Confirm Password" style="display:block">
        <button class="form__submit" id="submit" type="submit">Submit</button>
    </form>
</body>

</html>
